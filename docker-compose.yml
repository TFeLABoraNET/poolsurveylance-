services:
  poolsurveylance:
    build: .
    # Alternativ ein vorgebautes Image verwenden:
    # image: ghcr.io/dein-user/poolsurveylance:latest
    container_name: poolsurveylance
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # --- MQTT / Home Assistant (optional) ---
      # Zum Aktivieren auf "true" setzen und Broker-Daten eintragen.
      POOL_MQTT_ENABLED: "false"
      POOL_MQTT_HOST: "homeassistant.local"
      POOL_MQTT_PORT: "1883"
      POOL_MQTT_USERNAME: ""
      POOL_MQTT_PASSWORD: ""
      POOL_MQTT_BASE_TOPIC: "poolsurveylance"
      POOL_MQTT_DISCOVERY_PREFIX: "homeassistant"
      POOL_DEVICE_ID: "poolsurveylance"
      POOL_TIMEZONE: "Europe/Berlin"
