# Home-Assistant-Add-on-Konfiguration für PoolSurveylance.
# Nutzt das per GitHub Actions vorgebaute Image aus der GHCR.
name: PoolSurveylance
version: "0.2.0"
slug: poolsurveylance
description: Pool-Pflege-Assistent – Messwerte erfassen & Dosiervorschläge erhalten
url: https://github.com/TFeLABoraNET/poolsurveylance-
# WICHTIG: <owner> ist klein geschrieben (GHCR verlangt Kleinbuchstaben).
# Der Platzhalter {arch} wird von Home Assistant durch aarch64 / amd64 ersetzt.
image: "ghcr.io/tfelaboranet/{arch}-poolsurveylance"
arch:
  - aarch64
  - amd64
init: false
# App in die HA-Seitenleiste einbinden (kein Port nötig, HA-Login inklusive).
ingress: true
ingress_port: 8000
panel_icon: mdi:pool
panel_title: Pool
# Optionaler Direktzugriff per Port (kann in der HA-UI leer gelassen werden).
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Direkter Web-Zugriff (optional – sonst Ingress nutzen)
# Benutzeroptionen (erscheinen im "Konfiguration"-Tab des Add-ons).
options:
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
