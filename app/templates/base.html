<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ base }}/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="{{ base }}/" class="brand">💧 {{ app_name }}</a>
    <nav>
      <a href="{{ base }}/" class="{% block nav_home %}{% endblock %}">Messung</a>
      <a href="{{ base }}/history" class="{% block nav_history %}{% endblock %}">Verlauf</a>
      <a href="{{ base }}/trends" class="{% block nav_trends %}{% endblock %}">Trends</a>
      <a href="{{ base }}/pump-log" class="{% block nav_pump %}{% endblock %}">Pumpe</a>
      <a href="{{ base }}/dosing" class="{% block nav_dosing %}{% endblock %}">Dosierung</a>
      <a href="{{ base }}/inventory" class="{% block nav_inventory %}{% endblock %}">Lager</a>
      <a href="{{ base }}/checklists" class="{% block nav_lists %}{% endblock %}">Listen</a>
      <a href="{{ base }}/tools" class="{% block nav_tools %}{% endblock %}">Rechner</a>
      <a href="{{ base }}/config" class="{% block nav_config %}{% endblock %}">Einst.</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>PoolSurveylance · Dosiermengen sind Schätzwerte – immer nachmessen.</span>
    {% if mqtt_enabled %}<span class="badge">MQTT aktiv</span>{% endif %}
  </footer>
</body>
</html>
